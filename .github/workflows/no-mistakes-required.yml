name: Require no-mistakes
run-name: "PR #${{ github.event.pull_request.number }} body compliance - ${{ github.event.action }} - event ${{ github.run_number }} (run ${{ github.run_id }})"

# This gate runs from the base branch's trusted workflow definition and never
# executes pull-request code. It publishes the required context directly on the
# PR head commit because pull_request_target runs are attached to the base SHA.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: no-mistakes-required-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: PR must be raised via no-mistakes
    runs-on: ubuntu-latest
    steps:
      - name: Mark the required status as pending
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATUS_CONTEXT: PR must be raised via no-mistakes
        run: |
          gh api --method POST "repos/${REPO}/statuses/${PR_HEAD_SHA}" \
            -f state=pending \
            -f context="${STATUS_CONTEXT}" \
            -f description='verifying no-mistakes signature' \
            -f target_url="${RUN_URL}" >/dev/null

      - name: Check out the gate script from the base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Verify no-mistakes signature in PR body
        id: gate
        continue-on-error: true
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
        run: bash ./.github/scripts/no-mistakes-gate.sh

      - name: Publish the required status on the PR head
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATUS_CONTEXT: PR must be raised via no-mistakes
          GATE_OUTCOME: ${{ steps.gate.outcome }}
        run: |
          if [ "${GATE_OUTCOME}" = success ]; then
            state=success
            description='no-mistakes gate passed'
          else
            state=failure
            description='no-mistakes signature required'
          fi

          gh api --method POST "repos/${REPO}/statuses/${PR_HEAD_SHA}" \
            -f state="${state}" \
            -f context="${STATUS_CONTEXT}" \
            -f description="${description}" \
            -f target_url="${RUN_URL}" >/dev/null

          [ "${state}" = success ]
