name: Require no-mistakes
run-name: "PR #${{ github.event.pull_request.number }} body compliance - ${{ github.event.action }} - event ${{ github.run_number }} (run ${{ github.run_id }})"

# No paths / paths-ignore filter here, deliberately. This workflow backs a
# required status check, and a path-filtered required check never reports at
# all, leaving the PR blocked on a status that can never arrive. That is the
# one intentional exception to the repo rule that every pull_request workflow
# excludes the release-please output set; test/release-ci-exclusions.test.ts
# encodes both halves.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read

# GitHub concurrency groups retain at most one pending run, replacing older
# pending runs even when cancel-in-progress is false. Give body-bearing events
# an immutable per-event group so first-time-fork approvals can never collapse
# opened/edited checks. Keep synchronize/reopened coalescing as before.
concurrency:
  group: no-mistakes-required-${{ github.event.pull_request.number }}-${{ (github.event.action == 'opened' || github.event.action == 'edited') && github.run_id || 'head-change' }}
  cancel-in-progress: true

jobs:
  check:
    name: PR must be raised via no-mistakes
    runs-on: ubuntu-latest
    steps:
      # Check out the BASE branch, never the PR head: the gate script must come
      # from trusted, already-merged code so a pull request cannot weaken the
      # check that judges it.
      - name: Check out the gate script from the base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Verify no-mistakes signature in PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
          # Head binding: the gate script requires the attestation's head_sha to
          # equal this, so a commit pushed after the no-mistakes run cannot pass
          # on the stale attestation left in the body.
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          script=./.github/scripts/no-mistakes-gate.sh
          if [ -f "$script" ]; then
            bash "$script"
            exit 0
          fi
          # Bootstrap only: a PR whose base predates the gate script (including
          # the PR that introduces it) has nothing trusted to run. Fall back to
          # the signature check alone, which grants NO exemptions and is
          # therefore strictly stricter than the script. Once the script is on
          # main this branch is unreachable for any PR based on it.
          echo "::warning::Base branch predates ${script}; falling back to the signature check with no exemptions."
          marker='Updates from [git push no-mistakes](https://github.com/kunchenguid/no-mistakes)'
          if printf '%s' "${PR_BODY:-}" | grep -qF -- "$marker"; then
            echo "Found no-mistakes signature in PR #${PR_NUMBER} body."
            exit 0
          fi
          {
            echo "::error::This PR was not raised through no-mistakes."
            echo
            echo "Its base branch predates ${script}, so only the signature check applies."
            echo "Rebase onto a main that contains the gate script, or raise the PR"
            echo "through 'git push no-mistakes'. See CONTRIBUTING.md."
            echo
            echo "PR author: ${PR_AUTHOR}"
          } >&2
          exit 1
